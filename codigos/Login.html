  <script>
    let senhaVisible = false;

    function toggleSenhaVisibility(senhaId) {
      const senhaInput = document.getElementById(senhaId);
      const icone = document.getElementById('icone');

      if (senhaInput.value) {
        senhaVisible = !senhaVisible;
        if (senhaVisible) {
          senhaInput.type = "text";
          icone.src = "Imagens/btn/eye-off.svg";
        } else {
          senhaInput.type = "password";
          icone.src = "Imagens/btn/eye.svg";
        }
      }
    }

    function mostrarRequisitosSenha() {
      document.getElementById("requisitosSenha").style.display = "block";
    }

    function esconderRequisitosSenha() {
      document.getElementById("requisitosSenha").style.display = "none";
    }

    function validarSenha() {
      var mai = document.querySelector('.mais');
      var num = document.querySelector('.num');
      var esp = document.querySelector('.esp');
      var qtd = document.querySelector('.qtd');
      var senhaInput = document.getElementById('senha1');
      var btnCadastro = document.getElementById('btnCadastro');

      const maiuscula = /[A-Z]/;
      const numero = /[0-9]/;
      const especiais = /[!@#\$%\^&\*\(\)_\+\-=\.\,:\u003C>\|\~]/;
      var senha = senhaInput.value;

      var m = false;
      var n = false;
      var e = false;
      var t = false;

      if (maiuscula.test(senha)) {
        m = true;
        mai.style.color = 'green';
      } else {
        m = false;
        mai.style.color = 'red';
      }
      if (numero.test(senha)) {
        n = true;
        num.style.color = 'green';
      } else {
        n = false;
        num.style.color = 'red';
      }
      if (especiais.test(senha)) {
        e = true;
        esp.style.color = 'green';
      } else {
        e = false;
        esp.style.color = 'red';
      }
      if (senha.length >= 8) {
        t = true;
        qtd.style.color = 'green';
      } else {
        t = false;
        qtd.style.color = 'red';
      }

      if (m && n && e && t) {
        btnCadastro.removeAttribute('disabled');
      } else {
        btnCadastro.setAttribute('disabled', 'disabled');
      }
    }
  </script>
